<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>
<body>

<header>
    <h1>TechFest Registration</h1>
</header>

<nav>
    <a href="index.html">Home</a> |
    <a href="events.html">Events</a> |
    <a href="schedule.html">Schedule</a> |
    <a href="register.html">Register</a> |
    <a href="contact.html">Contact</a>
</nav>

<hr>

<main>
<h2>Registration Form</h2>

<form>

    <label>Name:</label>
    <input type="text" name="name" required>

    <br><br>

    <label>Email:</label>
    <input type="email" name="email" required>

    <br><br>

    <label>Phone Number:</label>
    <input type="tel" name="phone" required>

    <br><br>

    <label>Department:</label>

    <select name="department">
        <option>CSE</option>
        <option>AI & Data Science</option>
        <option>Mechanical</option>
        <option>Electronics</option>
    </select>

    <br><br>

    <label>Year of Study:</label>

    <select name="year">
        <option>1st Year</option>
        <option>2nd Year</option>
        <option>3rd Year</option>
        <option>4th Year</option>
    </select>

    <br><br>

    <p>Participation Type:</p>

    <input type="radio" name="type" value="individual">
    Individual

    <input type="radio" name="type" value="team">
    Team

    <br><br>

    <p>Select Events:</p>

    <input type="checkbox" name="event" value="coding">
    Coding

    <input type="checkbox" name="event" value="robotics">
    Robotics

    <input type="checkbox" name="event" value="quiz">
    Quiz

    <br><br>

    <label>Message:</label>
    <br>

    <textarea name="message" rows="5" cols="30"></textarea>

    <br><br>

    <input type="submit" value="Submit">

    <input type="reset" value="Reset">

</form>
</main>

<footer>
    <p>Thank You for Registration!</p>
</footer>

</body>
</html>
